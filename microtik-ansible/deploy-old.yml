---
- name: Full L3 Configuration for MikroTik hEX Lite
  hosts: mikrotiks
  gather_facts: false
  connection: local

  # Це магія Ansible, яка автоматично підставить дані доступу 
  # в усі модулі community.routeros.api у цьому плейбуці
  module_defaults:
    community.routeros.api:
      hostname: "{{ inventory_hostname }}"
      username: "{{ ansible_user }}"
      password: "{{ ansible_password }}"

  tasks:
    # --- 1. ПІДГОТОВКА ІНТЕРФЕЙСІВ ---
    - name: Search for any existing bridge
      community.routeros.api:
        path: "interface bridge"
        cmd: "print"
      register: existing_bridges

    - name: Rename default bridge to bridge_lan
      community.routeros.api:
        path: "interface bridge"
        # Ми беремо .id першого знайденого моста і змінюємо йому ім'я
        update: >
              .id={{ existing_bridges.msg[0]['.id'] }}
              name=bridge_lan
              comment=Adopted_by_Ansible

        # Виконуємо, тільки якщо міст є, але він називається не так, як нам треба
      when:
        - existing_bridges.msg | length > 0
        - existing_bridges.msg[0].name != "bridge_lan"

    - name: Ensure ports ether2-ether5 are in bridge_lan
      community.routeros.api:
        path: "interface bridge port"
        # Перевіряємо, чи конкретний інтерфейс вже є в мосту
        query:  ".id WHERE interface == {{ item }}"
      register: port_check_loop
      # Цикл по списку інтерфейсів
      loop:
        - ether2
        - ether3
        - ether4
        - ether5

    - name: Add missing ports to bridge_lan
      community.routeros.api:
        path: "interface bridge port"
        add: "bridge=bridge_lan interface={{ item.item }}"
      # item.item посилається на ім'я порту з попереднього циклу
      # item.msg — це результат query для цього порту
      when: item.msg | length == 0
      loop: "{{ port_check_loop.results }}"

    # --- 2. МЕРЕЖЕВІ НАЛАШТУВАННЯ (IP & WAN) ---
    - name: Ensure DHCP Client is active on ether1 (WAN)
      community.routeros.api:
        path: "ip dhcp-client"
        # add_if_missing працює як спрощена перевірка для деяких шляхів
        add: "interface=ether1 disabled=no comment='Internet from L1'"
      ignore_errors: yes # Щоб плейбук не впав, якщо клієнт уже є

    - name: Check for LAN IP
      community.routeros.api:
        path: "ip address"
        query: ".id WHERE address == 192.168.88.1/24"
      register: ip_check

    - name: Set LAN IP Address
      community.routeros.api:
        path: "ip address"
        add: "address=192.168.88.1/24 interface=bridge_lan"
      when: ip_check.msg | length == 0

    # --- 3. DHCP СЕРВЕР ТА ПУЛ ---
    - name: Check for IP Pool
      community.routeros.api:
        path: "ip pool"
        query: ".id WHERE name == dhcp_pool"
      register: pool_check

    - name: Create DHCP Pool
      community.routeros.api:
        path: "ip pool"
        add: "name=dhcp_pool ranges=192.168.88.10-192.168.88.100"
      when: pool_check.msg | length == 0

    - name: Check for DHCP Server
      community.routeros.api:
        path: "ip dhcp-server"
        query: ".id WHERE name == lan_dhcp"
      register: dhcp_check

    - name: Create DHCP Server
      community.routeros.api:
        path: "ip dhcp-server"
        add: "name=lan_dhcp interface=bridge_lan address-pool=dhcp_pool disabled=no"
      when: dhcp_check.msg | length == 0

    - name: Ensure DHCP Network exists
      community.routeros.api:
        path: "ip dhcp-server network"
        add: "address=192.168.88.0/24 gateway=192.168.88.1 dns-server=1.1.1.1"
      ignore_errors: yes

    # --- 4. FIREWALL & NAT ---
    - name: Check for NAT rule
      community.routeros.api:
        path: "ip firewall nat"
        query: ".id WHERE action == masquerade"
      register: nat_check

    - name: Configure NAT (Masquerade)
      community.routeros.api:
        path: "ip firewall nat"
        add: "chain=srcnat out-interface=ether1 action=masquerade"
      when: nat_check.msg | length == 0

     # --- 5 SET ROUTER IDENTIFY ---
    - name: Check current System Identity
      community.routeros.api:
        path: "system identity"
        # Ми просто запитуємо поточні дані
        cmd: "print"
      register: identity_info

    - name: Set System Identity to hEX-Lite-DevOps
      community.routeros.api:
        path: "system identity"
        # Використовуємо update, оскільки в system identity завжди є один запис
        update: "name=hEX-Lite-DevOps"
      # Виконуємо лише якщо поточне ім'я не збігається
      when: identity_info.msg[0].name != "hEX-Lite-DevOps"
