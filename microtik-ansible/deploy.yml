---
- name: Full L3 Configuration for MikroTik hEX Lite
  hosts: mikrotiks
  gather_facts: false
  connection: local

  module_defaults:
    community.routeros.api:
      hostname: "{{ ansible_host }}"
      username: "{{ ansible_user }}"
      password: "{{ ansible_password }}"

  tasks:
    # --- 1. ПІДГОТОВКА ІНТЕРФЕЙСІВ ---
    - name: Search for any existing bridge
      community.routeros.api:
        path: "interface bridge"
        cmd: "print"
      register: existing_bridges

    - name: Rename default bridge to bridge_lan
      community.routeros.api:
        path: "interface bridge"
        update: >
          .id={{ existing_bridges.msg[0]['.id'] }}
          name=bridge_lan
          comment=Adopted_by_Ansible
      when:
        - existing_bridges.msg | length > 0
        - existing_bridges.msg[0].name != "bridge_lan"

# 1. Отримуємо список усіх портів, які ВЖЕ є в будь-яких мостах
    - name: Get all current bridge ports
      community.routeros.api:
        path: "interface bridge port"
        cmd: "print"
      register: current_bridge_ports

    # 2. Додаємо порти, яких немає в отриманому списку
    - name: Add ports to bridge_lan if not already bridged
      community.routeros.api:
        path: "interface bridge port"
        add: "bridge=bridge_lan interface={{ item }}"
      loop:
        - ether2
        - ether3
        - ether4
        - ether5
      # Перевіряємо, чи назва порту (item) НЕ зустрічається серед уже доданих портів
      when: item not in (current_bridge_ports.msg | map(attribute='interface') | list)
      ignore_errors: true

    # --- 2. МЕРЕЖЕВІ НАЛАШТУВАННЯ ---
    - name: Get all current IP addresses
      community.routeros.api:
        path: "ip address"
        cmd: "print"
      register: current_ips

    - name: Set LAN IP Address
      community.routeros.api:
        path: "ip address"
        add: "address=192.168.88.1/24 interface=bridge_lan"
      # Перевіряємо, чи наша адреса вже є у списку 'address'
      when: "'192.168.88.1/24' not in (current_ips.msg | map(attribute='address') | list)"
    
      # --- 3. DHCP СЕРВЕР ---
    - name: Create DHCP Pool
      community.routeros.api:
        path: "ip pool"
        add: "name=dhcp_pool ranges=192.168.88.10-192.168.88.100"
      # Спрощуємо: додаємо лише якщо немає в списку (можна додати check task)
      ignore_errors: true 

    - name: Create DHCP Server
      community.routeros.api:
        path: "ip dhcp-server"
        add: "name=lan_dhcp interface=bridge_lan address-pool=dhcp_pool disabled=false"
      ignore_errors: true

    - name: Ensure DHCP Network exists
      community.routeros.api:
        path: "ip dhcp-server network"
        add: "address=192.168.88.0/24 gateway=192.168.88.1 dns-server=1.1.1.1"
      ignore_errors: true

    # --- 4. FIREWALL & NAT ---
    - name: Configure NAT (Masquerade)
      community.routeros.api:
        path: "ip firewall nat"
        add: "chain=srcnat out-interface=ether1 action=masquerade"
      ignore_errors: true

    # --- 5. SYSTEM IDENTITY ---
    - name: Set System Identity
      community.routeros.api:
        path: "system identity"
        # Просто встановлюємо ім'я без використання логіки оновлення за ID
        add: "name=hEX-Lite-DevOps"
      ignore_errors: true

