services:
  # Експортер, який спілкується з API
  ecoflow-exporter:
    image: tess1o/go-ecoflow-exporter:latest # Приклад популярного образу
    container_name: ecoflow-exporter
    restart: always
    env_file: .env
    ports:
      - "8080:8080"
    networks:
      - monitoring

  # База даних метрик
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/pormetheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - monitoring
    depends_on:
      - ecoflow-exporter

  # Панель керування
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring
    depends_on:
      - prometheus

# Опис мереж: контейнери бачать один одного за іменами в цій мережі
networks:
  monitoring:
    driver: bridge

# Опис сховищ: щоб дані не зникли після перезавантаження
volumes:
  prometheus_data:
  grafana_data:
